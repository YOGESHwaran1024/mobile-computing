<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1B2A49"/></marker></defs>
<rect width="1200" height="800" fill="#F5F7FB"/>
<text x="600" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#1B2A49">Handoff (Handover) Scenario in a Mobile Network</text>
<!-- cells -->
<circle cx="300" cy="260" r="170" fill="#0984E3" opacity=".15" stroke="#0984E3" stroke-width="2"/>
<circle cx="640" cy="260" r="170" fill="#00B894" opacity=".15" stroke="#00B894" stroke-width="2"/>
<text x="300" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#0984E3">Cell A (Serving)</text>
<text x="640" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#00B894">Cell B (Target)</text>
<!-- towers -->
<g font-size="14" font-weight="600" text-anchor="middle" fill="#1B2A49">
<path d="M300 200 l-18 70 h36z" fill="#0984E3"/><text x="300" y="295">BTS-A</text>
<path d="M640 200 l-18 70 h36z" fill="#00B894"/><text x="640" y="295">BTS-B</text></g>
<!-- MS path -->
<path d="M200 380 Q 470 330 740 380" stroke="#E17055" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/>
<g font-size="22" text-anchor="middle"><text x="250" y="395">📱</text><text x="470" y="360">📱</text><text x="700" y="395">📱</text></g>
<g font-size="13" text-anchor="middle" fill="#E17055" font-weight="600"><text x="250" y="420">1. Call starts</text><text x="470" y="385">2. Overlap zone</text><text x="700" y="420">3. Call continues</text></g>
<!-- signal bars -->
<text x="900" y="150" font-size="16" font-weight="700" fill="#1B2A49">Signal strength</text>
<rect x="900" y="165" width="260" height="14" rx="7" fill="#DDE3EE"/><rect x="900" y="165" width="70" height="14" rx="7" fill="#0984E3"/><text x="900" y="200" font-size="13" fill="#555">BTS-A weakening ↓</text>
<rect x="900" y="225" width="260" height="14" rx="7" fill="#DDE3EE"/><rect x="900" y="225" width="190" height="14" rx="7" fill="#00B894"/><text x="900" y="260" font-size="13" fill="#555">BTS-B strengthening ↑</text>
<!-- backhaul -->
<rect x="470" y="470" width="140" height="50" rx="10" fill="#6C5CE7"/><text x="540" y="501" text-anchor="middle" fill="#fff" font-weight="700">BSC / MSC</text>
<path d="M300 275 L300 495 L470 495" stroke="#1B2A49" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M640 275 L640 495 L610 495" stroke="#1B2A49" stroke-width="2" fill="none" marker-end="url(#a)"/>
<!-- steps -->
<g font-size="15" fill="#1B2A49">
<text x="60" y="580" font-size="18" font-weight="700">Handoff steps</text>
<circle cx="75" cy="615" r="14" fill="#0984E3"/><text x="75" y="620" text-anchor="middle" fill="#fff" font-size="13">1</text><text x="100" y="620">MS measures signal levels of serving &amp; neighbour cells</text>
<circle cx="75" cy="655" r="14" fill="#0984E3"/><text x="75" y="660" text-anchor="middle" fill="#fff" font-size="13">2</text><text x="100" y="660">Measurement report sent to BSC; level drops below threshold</text>
<circle cx="75" cy="695" r="14" fill="#0984E3"/><text x="75" y="700" text-anchor="middle" fill="#fff" font-size="13">3</text><text x="100" y="700">MSC/BSC allocates a channel in the target cell (BTS-B)</text>
<circle cx="75" cy="735" r="14" fill="#0984E3"/><text x="75" y="740" text-anchor="middle" fill="#fff" font-size="13">4</text><text x="100" y="740">Handoff command sent; MS tunes to new channel, old one is released</text></g>
</svg>
