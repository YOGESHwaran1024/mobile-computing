<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, Arial, sans-serif">
<rect width="1200" height="800" fill="#EEF1F6"/>
<text x="600" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#1B2A49">Localization Features – Mobile App Wireframe</text>
<!-- Phone 1: Language -->
<g transform="translate(60,90)"><rect width="320" height="660" rx="36" fill="#fff" stroke="#1B2A49" stroke-width="3"/>
<text x="160" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#1B2A49">Select Language</text>
<rect x="24" y="75" width="272" height="44" rx="10" fill="#EEF1F6"/><text x="44" y="103" font-size="14" fill="#888">🔍 Search language</text>
<g font-size="16" fill="#1B2A49">
<rect x="24" y="140" width="272" height="52" rx="10" fill="#E3F0FF" stroke="#0984E3"/><text x="44" y="172">English (India)</text><text x="270" y="172" fill="#0984E3">✓</text>
<rect x="24" y="204" width="272" height="52" rx="10" fill="#F5F7FB"/><text x="44" y="236">தமிழ் (Tamil)</text>
<rect x="24" y="268" width="272" height="52" rx="10" fill="#F5F7FB"/><text x="44" y="300">हिन्दी (Hindi)</text>
<rect x="24" y="332" width="272" height="52" rx="10" fill="#F5F7FB"/><text x="44" y="364">తెలుగు (Telugu)</text>
<rect x="24" y="396" width="272" height="52" rx="10" fill="#F5F7FB"/><text x="44" y="428">Español</text></g>
<rect x="24" y="580" width="272" height="50" rx="25" fill="#0984E3"/><text x="160" y="611" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Continue</text></g>
<!-- Phone 2: Region -->
<g transform="translate(440,90)"><rect width="320" height="660" rx="36" fill="#fff" stroke="#1B2A49" stroke-width="3"/>
<text x="160" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#1B2A49">Region &amp; Format</text>
<g font-size="14" fill="#1B2A49">
<text x="24" y="100" fill="#888">Country</text><rect x="24" y="108" width="272" height="46" rx="10" fill="#F5F7FB"/><text x="40" y="137">🇮🇳 India  ▾</text>
<text x="24" y="190" fill="#888">Currency</text><rect x="24" y="198" width="272" height="46" rx="10" fill="#F5F7FB"/><text x="40" y="227">₹ INR  ▾</text>
<text x="24" y="280" fill="#888">Date format</text><rect x="24" y="288" width="272" height="46" rx="10" fill="#F5F7FB"/><text x="40" y="317">DD/MM/YYYY  ▾</text>
<text x="24" y="370" fill="#888">Time zone</text><rect x="24" y="378" width="272" height="46" rx="10" fill="#F5F7FB"/><text x="40" y="407">IST (UTC+5:30)  ▾</text>
<text x="24" y="460" fill="#888">Units</text><rect x="24" y="468" width="130" height="44" rx="22" fill="#0984E3"/><text x="89" y="496" text-anchor="middle" fill="#fff">Metric</text><rect x="166" y="468" width="130" height="44" rx="22" fill="#F5F7FB"/><text x="231" y="496" text-anchor="middle">Imperial</text></g>
<rect x="24" y="580" width="272" height="50" rx="25" fill="#0984E3"/><text x="160" y="611" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Save</text></g>
<!-- Phone 3: Location -->
<g transform="translate(820,90)"><rect width="320" height="660" rx="36" fill="#fff" stroke="#1B2A49" stroke-width="3"/>
<rect x="24" y="30" width="272" height="44" rx="22" fill="#F5F7FB"/><text x="44" y="58" font-size="14" fill="#888">🔍 Search nearby</text>
<rect x="14" y="90" width="292" height="380" rx="16" fill="#DDEBDD"/>
<path d="M14 220 L306 180 M120 90 L170 470 M14 340 L306 360" stroke="#fff" stroke-width="10"/>
<circle cx="160" cy="270" r="46" fill="#0984E3" opacity=".2"/><circle cx="160" cy="270" r="10" fill="#0984E3" stroke="#fff" stroke-width="3"/>
<path d="M230 190 a14 14 0 1 1 0.1 0 l-0.1 0 -0 24 z" fill="#E17055"/><path d="M90 380 a14 14 0 1 1 0.1 0 l-0.1 0 -0 24 z" fill="#E17055"/>
<rect x="24" y="486" width="272" height="80" rx="14" fill="#fff" stroke="#E3E8F0"/><text x="40" y="516" font-size="16" font-weight="700" fill="#1B2A49">Current location</text><text x="40" y="540" font-size="13" fill="#666">Chennai, Tamil Nadu · 0.2 km away</text>
<rect x="24" y="582" width="272" height="50" rx="25" fill="#0984E3"/><text x="160" y="613" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Use this location</text></g>
</svg>
