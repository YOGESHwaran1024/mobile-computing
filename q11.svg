<rect x="24" y="200" width="212" height="44" rx="10" fill="#F5F7FB"/><text x="40" y="228" font-size="13" fill="#888">Password ••••••••</text>
<rect x="24" y="270" width="212" height="46" rx="23" fill="#0984E3"/><text x="130" y="299" text-anchor="middle" fill="#fff" font-weight="600">Login</text>
