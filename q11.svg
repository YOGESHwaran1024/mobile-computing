<rect x="20" y="190" width="180" height="46" rx="23" fill="#0984E3"/><text x="110" y="219" text-anchor="middle" fill="#fff" font-weight="600">It was me</text>
<rect x="20" y="250" width="180" height="46" rx="23" fill="#FF4D4F"/><text x="110" y="279" text-anchor="middle" fill="#fff" font-weight="600">Secure account</text>
<rect x="20" y="340" width="180" height="80" rx="12" fill="#F5F7FB"/><text x="110" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A49">Lost phone?</text><text x="110" y="395" text-anchor="middle" font-size="12" fill="#0984E3">Block SIM / Remote lock</text></g>
<path d="M300 400 L340 400" stroke="#E17055" stroke-width="3" marker-end="url(#a)"/><path d="M600 400 L640 400" stroke="#E17055" stroke-width="3" marker-end="url(#a)"/><path d="M900 400 L940 400" stroke="#E17055" stroke-width="3" marker-end="url(#a)"/>
