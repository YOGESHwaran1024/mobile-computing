<g font-size="14" fill="#1B2A49">
<rect x="16" y="90" width="228" height="56" rx="12" fill="#F5F7FB"/><text x="30" y="123">SIM PIN lock</text><rect x="190" y="108" width="40" height="22" rx="11" fill="#00B894"/>
<rect x="16" y="158" width="228" height="56" rx="12" fill="#F5F7FB"/><text x="30" y="191">Two-factor auth</text><rect x="190" y="176" width="40" height="22" rx="11" fill="#00B894"/>
<rect x="16" y="226" width="228" height="56" rx="12" fill="#F5F7FB"/><text x="30" y="259">Biometric login</text><rect x="190" y="244" width="40" height="22" rx="11" fill="#00B894"/>
<rect x="16" y="294" width="228" height="56" rx="12" fill="#F5F7FB"/><text x="30" y="327">Call/SMS encryption</text><rect x="190" y="312" width="40" height="22" rx="11" fill="#00B894"/>
<rect x="16" y="362" width="228" height="56" rx="12" fill="#F5F7FB"/><text x="30" y="395">Block unknown callers</text><rect x="190" y="380" width="40" height="22" rx="11" fill="#CCC"/>
<rect x="16" y="430" width="228" height="56" rx="12" fill="#F5F7FB"/><text x="30" y="463">Trusted devices</text><text x="215" y="463">›</text></g></g>
<!-- 4 Alert / lost -->
