<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, Arial, sans-serif">
<rect width="1200" height="800" fill="#FFF8EC"/>
<text x="600" y="60" text-anchor="middle" font-size="34" font-weight="800" fill="#1B2A49">What is a PLMN?</text>
<text x="600" y="92" text-anchor="middle" font-size="16" fill="#6B6B6B">Public Land Mobile Network</text>
<!-- definition -->
<rect x="100" y="120" width="1000" height="90" rx="18" fill="#1B2A49"/>
<text x="600" y="157" text-anchor="middle" font-size="18" fill="#fff">A PLMN is a mobile network run by one operator in one country,</text>
<text x="600" y="186" text-anchor="middle" font-size="18" fill="#FFD166">providing land-based radio services to the public.</text>
<!-- ID -->
<text x="600" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#1B2A49">PLMN ID = MCC + MNC</text>
<rect x="350" y="280" width="240" height="90" rx="14" fill="#E17055"/><text x="470" y="320" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">404</text><text x="470" y="350" text-anchor="middle" fill="#fff" font-size="14">MCC · Mobile Country Code</text>
<text x="610" y="335" font-size="34" font-weight="800" fill="#1B2A49">+</text>
<rect x="640" y="280" width="240" height="90" rx="14" fill="#0984E3"/><text x="760" y="320" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">45</text><text x="760" y="350" text-anchor="middle" fill="#fff" font-size="14">MNC · Mobile Network Code</text>
<text x="600" y="395" text-anchor="middle" font-size="13" fill="#6B6B6B">Example values (India). 3-digit MCC, 2–3 digit MNC.</text>
<!-- architecture -->
<text x="60" y="450" font-size="20" font-weight="700" fill="#1B2A49">Components of a PLMN</text>
<g font-size="15" font-weight="700" text-anchor="middle" fill="#fff">
<rect x="60" y="470" width="200" height="110" rx="16" fill="#6C5CE7"/><text x="160" y="515" font-size="30">📱</text><text x="160" y="550">Mobile Station</text><text x="160" y="568" font-size="12" font-weight="400">Handset + SIM</text>
<rect x="320" y="470" width="200" height="110" rx="16" fill="#00B894"/><text x="420" y="515" font-size="30">📡</text><text x="420" y="550">BSS / RAN</text><text x="420" y="568" font-size="12" font-weight="400">BTS + BSC</text>
<rect x="580" y="470" width="200" height="110" rx="16" fill="#0984E3"/><text x="680" y="515" font-size="30">🖥️</text><text x="680" y="550">Core Network</text><text x="680" y="568" font-size="12" font-weight="400">MSC · HLR · VLR</text>
<rect x="840" y="470" width="300" height="110" rx="16" fill="#E17055"/><text x="990" y="515" font-size="30">🌐</text><text x="990" y="550">External Networks</text><text x="990" y="568" font-size="12" font-weight="400">PSTN · Internet · other PLMNs</text></g>
<g stroke="#1B2A49" stroke-width="3"><line x1="260" y1="525" x2="320" y2="525"/><line x1="520" y1="525" x2="580" y2="525"/><line x1="780" y1="525" x2="840" y2="525"/></g>
<!-- roaming -->
<text x="60" y="640" font-size="20" font-weight="700" fill="#1B2A49">Home vs Visited PLMN (Roaming)</text>
<rect x="60" y="660" width="400" height="100" rx="16" fill="#DFF3EC" stroke="#00B894" stroke-width="2"/><text x="260" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#00755B">HPLMN – Home</text><text x="260" y="728" text-anchor="middle" font-size="14" fill="#333">Network where subscriber is registered</text>
<rect x="740" y="660" width="400" height="100" rx="16" fill="#E3F0FF" stroke="#0984E3" stroke-width="2"/><text x="940" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#0660AD">VPLMN – Visited</text><text x="940" y="728" text-anchor="middle" font-size="14" fill="#333">Network used while roaming</text>
<line x1="460" y1="710" x2="740" y2="710" stroke="#1B2A49" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="700" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2A49">Roaming agreement</text>
</svg>
